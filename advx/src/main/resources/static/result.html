<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>再活一次 · 复活体</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/shared.css">
</head>
<body x-data="resultPage()" x-init="init()" class="min-h-screen">

  <!-- Header -->
  <header class="border-b border-stone-300">
    <div class="max-w-6xl mx-auto px-8 py-6 flex items-center justify-between">
      <div>
        <div class="text-xs tracking-[0.3em] text-[var(--accent)] uppercase">Resurrect · E「反转」</div>
        <h1 class="text-2xl md:text-3xl font-black mt-1">再活一次<span class="text-[var(--accent)]">.</span></h1>
        <div class="text-xs text-stone-500 mt-1">从被放弃的项目里，找出仍然活着的部分</div>
      </div>
      <div class="text-xs text-stone-500 hidden md:block console">
        <span class="flame">🔥</span> multi-agent
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-8 py-10">

    <section class="fade-in">
      <div x-show="loading" class="py-24 text-center text-stone-500">
        <span class="flame">🔥</span> 载入复活体…
      </div>

      <template x-if="plan">
        <div>

          <!-- Hero -->
          <div class="text-center py-10 border-b border-stone-300">
            <div class="text-xs tracking-[0.4em] text-[var(--accent)] uppercase">RESURRECTED</div>
            <h2 class="text-4xl md:text-6xl font-black mt-3" x-text="plan.newProductName"></h2>
            <p class="text-lg text-stone-600 mt-3" x-text="plan.newProductSlogan"></p>
            <div class="mt-2 text-sm text-stone-400">
              从 <span class="text-stone-700 font-medium" x-text="plan.projectName"></span> 里复活
            </div>
          </div>

          <!-- Death Diagnosis -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-8 py-10 border-b border-stone-300">
            <div>
              <div class="text-xs tracking-widest text-stone-500 mb-2">死亡诊断书</div>
              <div class="prose text-stone-700 leading-relaxed whitespace-pre-wrap" x-text="plan.deathDiagnosis"></div>
            </div>
            <div>
              <div class="text-xs tracking-widest text-stone-500 mb-2">仍在跳动的心脏</div>
              <div class="border-l-4 border-[var(--accent)] pl-4">
                <div class="text-2xl font-bold" x-text="plan.heartTitle"></div>
                <div class="text-xs text-stone-500 mt-1">来自 <span class="console" x-text="plan.heartSourceHint"></span></div>
                <div class="text-stone-700 mt-3 leading-relaxed" x-text="plan.heartWhy"></div>
              </div>
              <div class="mt-6">
                <div class="text-xs tracking-widest text-stone-500 mb-2">卖点</div>
                <ul class="space-y-1">
                  <template x-for="s in plan.sellingPoints" :key="s">
                    <li class="text-stone-700"><span class="text-[var(--accent)]">→</span> <span x-text="s"></span></li>
                  </template>
                </ul>
              </div>
            </div>
          </div>

          <!-- Demo -->
          <div class="py-10 border-b border-stone-300">
            <div class="flex items-baseline justify-between mb-3">
              <div>
                <div class="text-xs tracking-widest text-stone-500">复活后的样子</div>
                <div class="text-xl font-bold">Live Demo</div>
              </div>
              <div class="text-xs" x-text="htmlFallback ? '（Level 1 兜底卡片）' : 'Level 2 · AI 现场生成'"></div>
            </div>

            <!-- 左：iframe   右：皮肤选择器 -->
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-5 items-start">
              <div class="lg:col-span-3">
                <div class="border-4 border-stone-800 rounded-lg overflow-hidden shadow-2xl bg-white">
                  <iframe x-ref="demoFrame"
                          :src="`/api/demo/${jobId}?skin=${selectedSkin}`"
                          sandbox="allow-scripts"
                          class="w-full"
                          style="height: 520px;"
                          @load="pushSkin()"></iframe>
                </div>
              </div>

              <aside class="lg:col-span-1">
                <div class="border border-stone-300 rounded-lg p-4 bg-white">
                  <div class="text-xs tracking-widest text-stone-500 mb-1">SKIN</div>
                  <div class="text-sm font-bold mb-3">切换皮肤</div>
                  <div class="text-xs text-stone-500 mb-3 leading-relaxed">
                    内核不变，只换外观。选择会同步到 demo，也会随下载压缩包一起带走。
                  </div>
                  <div class="space-y-2">
                    <template x-for="s in skins" :key="s.id">
                      <button type="button"
                              @click="chooseSkin(s.id)"
                              class="w-full text-left px-3 py-2 border rounded transition"
                              :class="selectedSkin === s.id
                                        ? 'border-[var(--accent)] bg-stone-50'
                                        : 'border-stone-200 hover:border-stone-400'">
                        <div class="flex items-center justify-between">
                          <div class="text-sm font-bold" x-text="s.label"></div>
                          <div x-show="selectedSkin === s.id" class="text-xs text-[var(--accent)]">已选</div>
                        </div>
                        <div class="text-xs text-stone-500 mt-1" x-text="s.description"></div>
                      </button>
                    </template>
                  </div>
                </div>
              </aside>
            </div>

            <div class="mt-4 flex items-center justify-between">
              <a :href="`/api/download/${jobId}?skin=${selectedSkin}`"
                 class="inline-flex items-center gap-2 px-4 py-2 bg-stone-800 text-white text-sm font-bold hover:bg-[var(--accent)] transition rounded">
                ↓ 下载复活体礼包（.zip · 当前皮肤：<span x-text="currentSkinLabel()"></span>）
              </a>
              <a :href="`/api/demo/${jobId}?skin=${selectedSkin}`" target="_blank"
                 class="text-sm text-[var(--accent)] hover:underline">↗ 在新窗口打开完整 demo</a>
            </div>
            <div class="mt-2 text-xs text-stone-400">
              礼包内含：<span class="console">index.html</span> · <span class="console">README.md</span> · <span class="console">plan.json</span> · <span class="console">heart.txt</span>
            </div>
          </div>

          <!-- Pitch + VC -->
          <template x-if="pitch">
            <div class="py-10">
              <div class="text-xs tracking-widest text-stone-500 mb-2">复活企划书</div>
              <div class="text-3xl font-black mb-6" x-text="pitch.oneLiner"></div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                  <div class="text-xs tracking-widest text-stone-500 mb-1">要解决的问题</div>
                  <div class="text-stone-700" x-text="pitch.problem"></div>
                </div>
                <div>
                  <div class="text-xs tracking-widest text-stone-500 mb-1">解决方案</div>
                  <div class="text-stone-700" x-text="pitch.solution"></div>
                </div>
                <div>
                  <div class="text-xs tracking-widest text-stone-500 mb-1">目标用户</div>
                  <div class="text-stone-700" x-text="pitch.targetUser"></div>
                </div>
                <div>
                  <div class="text-xs tracking-widest text-stone-500 mb-1">下一个最小实验</div>
                  <div class="text-stone-700" x-text="pitch.nextExperiment"></div>
                </div>
              </div>

              <div class="mt-6">
                <div class="text-xs tracking-widest text-stone-500 mb-2">市场假设</div>
                <ol class="list-decimal list-inside space-y-1">
                  <template x-for="a in pitch.marketAssumptions" :key="a">
                    <li class="text-stone-700" x-text="a"></li>
                  </template>
                </ol>
              </div>

              <!-- VC 直通车 -->
              <div class="mt-10 pt-8 border-t border-stone-300">
                <div class="text-xs tracking-[0.4em] text-[var(--accent)] uppercase mb-2">VC 直通车 · 让复活体去争一次生的机会</div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <template x-for="v in pitch.vcLinks" :key="v.name">
                    <a :href="v.url" target="_blank" rel="noopener"
                       class="block border border-stone-300 rounded-lg p-4 hover:border-[var(--accent)] hover:bg-white transition">
                      <div class="font-bold" x-text="v.name"></div>
                      <div class="text-xs text-stone-500 mt-1" x-text="v.note"></div>
                      <div class="text-xs text-[var(--accent)] mt-2">前往投递 →</div>
                    </a>
                  </template>
                </div>
              </div>
            </div>
          </template>

          <!-- Agent 详情（可展开） -->
          <div class="py-8 border-t border-stone-300">
            <details>
              <summary class="text-sm text-stone-500 hover:text-[var(--accent)]">▶ 展开四位 Agent 的详细观点与证据</summary>
              <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-6">
                <template x-for="op in opinionsList" :key="op.agentName">
                  <div class="bg-white border border-stone-200 rounded-lg p-4">
                    <div class="font-bold" x-text="op.agentName"></div>
                    <div class="text-xs text-stone-500 italic" x-text="op.role"></div>
                    <div class="text-sm mt-2" x-text="op.summary"></div>
                    <template x-if="op.evidence && op.evidence.length">
                      <div class="mt-3 space-y-2">
                        <template x-for="ev in op.evidence" :key="ev.quote">
                          <div class="text-xs bg-stone-50 border-l-2 border-stone-400 pl-2 py-1">
                            <div class="console text-stone-500" x-text="ev.filePath"></div>
                            <div class="italic text-stone-700">"<span x-text="ev.quote"></span>"</div>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </details>
          </div>

          <div class="text-center py-8">
            <a href="/"
               class="inline-block px-6 py-3 border-2 border-stone-800 text-stone-800 font-bold hover:bg-stone-800 hover:text-white transition">
              再复活一个项目
            </a>
          </div>
        </div>
      </template>
    </section>
  </main>

  <footer class="border-t border-stone-300 mt-10">
    <div class="max-w-6xl mx-auto px-8 py-6 text-xs text-stone-500 flex flex-col md:flex-row md:justify-between gap-2">
      <div>再活一次 · Digital Project Resurrection System · AdventureX 2026</div>
      <div class="console"></div>
    </div>
  </footer>

<script>
function resultPage() {
  return {
    jobId: null,
    plan: null,
    pitch: null,
    opinionsList: [],
    htmlFallback: false,
    loading: true,
    skins: [
      { id: 'paper',  label: '纸本原味', description: 'AI 现场生成的原始配色' },
      { id: 'noir',   label: '深夜反色', description: '整体反色，暗光模式' },
      { id: 'sunset', label: '落日暖橙', description: '偏暖，黄昏感' },
      { id: 'mint',   label: '薄荷冷绿', description: '偏冷，实验室感' },
      { id: 'mono',   label: '极简黑白', description: '去饱和，只留结构' }
    ],
    selectedSkin: 'paper',

    init() {
      const params = new URLSearchParams(location.search);
      this.jobId = params.get('jobId');
      if (!this.jobId) {
        alert('缺少 jobId，回到首页重新上传');
        location.href = '/';
        return;
      }
      // 记忆用户上次选择
      try {
        const stored = localStorage.getItem('rz-skin');
        if (stored && this.skins.some(s => s.id === stored)) this.selectedSkin = stored;
      } catch (_) {}
      this.loadSkins();
      this.loadResult();
    },

    async loadSkins() {
      try {
        const r = await fetch('/api/skins');
        if (!r.ok) return;
        const data = await r.json();
        if (Array.isArray(data.skins) && data.skins.length) this.skins = data.skins;
      } catch (_) { /* 用内置默认 */ }
    },

    chooseSkin(id) {
      this.selectedSkin = id;
      try { localStorage.setItem('rz-skin', id); } catch (_) {}
      this.pushSkin();
    },

    /** 主动 postMessage 通知 iframe 换皮 */
    pushSkin() {
      const el = this.$refs.demoFrame;
      if (!el || !el.contentWindow) return;
      try {
        el.contentWindow.postMessage({ type: 'rz:setSkin', skin: this.selectedSkin }, '*');
      } catch (_) {}
    },

    currentSkinLabel() {
      const s = this.skins.find(x => x.id === this.selectedSkin);
      return s ? s.label : this.selectedSkin;
    },

    async loadResult() {
      try {
        const r = await fetch(`/api/result/${this.jobId}`);
        if (!r.ok) throw new Error('拉取结果失败');
        const data = await r.json();
        if (data.status !== 'DONE') {
          // 还没跑完 → 回到进度页
          location.href = `/progress.html?jobId=${encodeURIComponent(this.jobId)}`;
          return;
        }
        this.plan = data.plan;
        this.pitch = data.pitch;
        this.opinionsList = data.opinions || [];
        this.htmlFallback = !!data.htmlFallback;
      } catch (err) {
        alert(err.message);
      } finally {
        this.loading = false;
      }
    }
  };
}
</script>
</body>
</html>
