<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fafafa">
  <title>再活一次 · 复活体</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/shared.css?v=20260724-ui3">
</head>
<body x-data="resultPage()" x-init="init()" class="page-shell">
  <header class="site-header">
    <div class="site-header-inner">
      <a href="/" class="brand" aria-label="返回再活一次首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M12 3v18M7 8.5A5 5 0 0 1 12 4a5 5 0 0 1 5 4.5c0 3.7-5 5.1-5 8.5"/>
            <path d="m8.5 14.5 3.5 3 3.5-3"/>
          </svg>
        </span>
        <span>
          <span class="brand-name">再活一次</span>
          <span class="brand-subtitle">Resurrection Report</span>
        </span>
      </a>
      <div class="header-meta">
        <span class="ui-badge">
          <span class="status-dot" aria-hidden="true"></span>
          <span class="header-label">方案已生成</span>
        </span>
        <span class="ui-badge ui-badge-primary">Resurrected</span>
      </div>
    </div>
  </header>

  <main class="page-main result-main">
    <section class="fade-in">
      <div x-show="loading" class="ui-card loading-panel" aria-live="polite">
        <div>
          <div class="spinner" aria-hidden="true"></div>
          <div class="card-heading">正在载入复活体</div>
          <div class="muted-copy text-sm mt-2">整理 Demo、企划书与协作证据…</div>
        </div>
      </div>

      <template x-if="plan">
        <div class="result-stack">
          <section class="ui-card result-hero">
            <span class="ui-badge ui-badge-primary">
              <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <path d="m12 3-1.9 4.9L5 10l5.1 2.1L12 17l1.9-4.9L19 10l-5.1-2.1L12 3Z"/>
              </svg>
              Resurrection complete
            </span>
            <h1 class="result-title" x-text="plan.newProductName"></h1>
            <p class="result-slogan" x-text="plan.newProductSlogan"></p>
            <div class="result-origin">
              从 <strong x-text="plan.projectName"></strong> 中重新生长
            </div>
          </section>

          <section class="diagnosis-grid" aria-label="项目诊断与核心价值">
            <article class="ui-card diagnosis-card">
              <div class="card-icon-title">
                <span class="card-icon" aria-hidden="true">
                  <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></svg>
                </span>
                <div>
                  <h2 class="card-heading">死亡诊断书</h2>
                  <p class="card-kicker">为什么这个项目曾经停下</p>
                </div>
              </div>
              <div class="long-copy whitespace-pre-wrap" x-text="plan.deathDiagnosis"></div>
            </article>

            <article class="ui-card diagnosis-card diagnosis-card-accent">
              <div class="card-icon-title">
                <span class="card-icon" aria-hidden="true">
                  <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>
                </span>
                <div>
                  <h2 class="card-heading">仍在跳动的心脏</h2>
                  <p class="card-kicker">最值得被保留的核心资产</p>
                </div>
              </div>
              <div class="heart-title" x-text="plan.heartTitle"></div>
              <div class="source-hint">来自 <span class="console" x-text="plan.heartSourceHint"></span></div>
              <div class="long-copy" x-text="plan.heartWhy"></div>
              <ul class="selling-points">
                <template x-for="s in plan.sellingPoints" :key="s">
                  <li><span class="selling-check">✓</span><span x-text="s"></span></li>
                </template>
              </ul>
            </article>
          </section>

          <section class="ui-card demo-section" aria-labelledby="demo-title">
            <div class="demo-section-header">
              <div>
                <div class="section-kicker">Live preview</div>
                <h2 id="demo-title" class="section-title">复活后的样子</h2>
              </div>
              <span class="ui-badge" x-text="htmlFallback ? 'Level 1 · 兜底卡片' : 'Level 2 · AI 现场生成'"></span>
            </div>

            <div class="demo-layout">
              <div class="browser-frame">
                <div class="browser-bar" aria-hidden="true">
                  <span class="browser-dot"></span>
                  <span class="browser-dot"></span>
                  <span class="browser-dot"></span>
                  <span class="browser-address console">localhost · generated-demo</span>
                </div>
                <iframe x-ref="demoFrame"
                        :src="`/api/demo/${jobId}?skin=${selectedSkin}`"
                        sandbox="allow-scripts"
                        class="demo-frame"
                        title="复活项目实时预览"
                        @load="pushSkin()"></iframe>
              </div>

              <aside class="ui-card skin-panel" aria-label="Demo 皮肤设置">
                <div class="skin-panel-title">外观皮肤</div>
                <div class="skin-panel-copy">内核不变，只切换视觉语言。所选皮肤会一并写入下载礼包。</div>
                <div class="skin-list">
                  <template x-for="s in skins" :key="s.id">
                    <button type="button"
                            @click="chooseSkin(s.id)"
                            class="skin-option"
                            :class="selectedSkin === s.id ? 'selected' : ''"
                            :aria-pressed="selectedSkin === s.id">
                      <span class="skin-option-row">
                        <span class="skin-name" x-text="s.label"></span>
                        <span x-show="selectedSkin === s.id" class="ui-badge ui-badge-primary">已选择</span>
                      </span>
                      <span class="skin-description" x-text="s.description"></span>
                    </button>
                  </template>
                </div>
              </aside>
            </div>

            <div class="demo-actions">
              <a :href="`/api/download/${jobId}?skin=${selectedSkin}`"
                 class="ui-button ui-button-primary">
                <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
                下载复活体礼包 · <span x-text="currentSkinLabel()"></span>
              </a>
              <a :href="`/api/demo/${jobId}?skin=${selectedSkin}`"
                 target="_blank"
                 class="ui-button ui-button-outline">
                在新窗口打开
                <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
              </a>
            </div>
            <div class="package-note">
              礼包包含：<span class="console">index.html</span> · <span class="console">README.md</span> ·
              <span class="console">plan.json</span> · <span class="console">heart.txt</span>
            </div>
          </section>

          <template x-if="pitch">
            <section class="ui-card pitch-section" aria-labelledby="pitch-title">
              <div class="section-kicker">Resurrection brief</div>
              <h2 id="pitch-title" class="pitch-one-liner" x-text="pitch.oneLiner"></h2>

              <div class="pitch-grid">
                <article class="pitch-item">
                  <div class="pitch-item-label">要解决的问题</div>
                  <div class="pitch-item-copy" x-text="pitch.problem"></div>
                </article>
                <article class="pitch-item">
                  <div class="pitch-item-label">解决方案</div>
                  <div class="pitch-item-copy" x-text="pitch.solution"></div>
                </article>
                <article class="pitch-item">
                  <div class="pitch-item-label">目标用户</div>
                  <div class="pitch-item-copy" x-text="pitch.targetUser"></div>
                </article>
                <article class="pitch-item">
                  <div class="pitch-item-label">下一个最小实验</div>
                  <div class="pitch-item-copy" x-text="pitch.nextExperiment"></div>
                </article>
              </div>

              <div class="assumption-wrap">
                <div class="card-heading">需要验证的市场假设</div>
                <ol class="assumption-list">
                  <template x-for="a in pitch.marketAssumptions" :key="a">
                    <li x-text="a"></li>
                  </template>
                </ol>
              </div>

              <div class="vc-wrap">
                <div class="section-kicker">VC 直通车</div>
                <h3 class="section-title">让复活体争取一次真实机会</h3>
                <div class="vc-grid">
                  <template x-for="v in pitch.vcLinks" :key="v.name">
                    <a :href="v.url" target="_blank" rel="noopener" class="ui-card vc-card">
                      <div class="vc-name" x-text="v.name"></div>
                      <div class="vc-note" x-text="v.note"></div>
                      <div class="vc-link">前往投递 <span aria-hidden="true">↗</span></div>
                    </a>
                  </template>
                </div>
              </div>
            </section>
          </template>

          <section class="ui-card agent-section">
            <details>
              <summary class="agent-summary">查看五位 Agent 的完整观点与项目证据</summary>
              <div class="agent-grid">
                <template x-for="op in opinionsList" :key="op.agentName">
                  <article class="agent-card">
                    <div class="agent-name" x-text="op.agentName"></div>
                    <div class="agent-role" x-text="op.role"></div>
                    <div class="agent-opinion" x-text="op.summary"></div>
                    <template x-if="op.evidence && op.evidence.length">
                      <div class="evidence-list">
                        <template x-for="ev in op.evidence" :key="ev.quote">
                          <div class="evidence-item">
                            <div class="console text-stone-500" x-text="ev.filePath"></div>
                            <div class="mt-1">“<span x-text="ev.quote"></span>”</div>
                          </div>
                        </template>
                      </div>
                    </template>
                  </article>
                </template>
              </div>
            </details>
          </section>

          <div class="result-restart">
            <a href="/" class="ui-button ui-button-outline">
              <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg>
              再复活一个项目
            </a>
          </div>
        </div>
      </template>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <span>再活一次 · Digital Project Resurrection System</span>
      <span class="console">AdventureX 2026 · E「反转」</span>
    </div>
  </footer>

<script>
function resultPage() {
  return {
    jobId: null,
    plan: null,
    pitch: null,
    opinionsList: [],
    htmlFallback: false,
    loading: true,
    skins: [
      { id: 'paper',  label: '纸本原味', description: 'AI 现场生成的原始配色' },
      { id: 'noir',   label: '深夜反色', description: '整体反色，暗光模式' },
      { id: 'sunset', label: '落日暖橙', description: '偏暖，黄昏感' },
      { id: 'mint',   label: '薄荷冷绿', description: '偏冷，实验室感' },
      { id: 'mono',   label: '极简黑白', description: '去饱和，只留结构' }
    ],
    selectedSkin: 'paper',

    init() {
      const params = new URLSearchParams(location.search);
      this.jobId = params.get('jobId');
      if (!this.jobId) {
        alert('缺少 jobId，回到首页重新上传');
        location.href = '/';
        return;
      }
      // 记忆用户上次选择
      try {
        const stored = localStorage.getItem('rz-skin');
        if (stored && this.skins.some(s => s.id === stored)) this.selectedSkin = stored;
      } catch (_) {}
      this.loadSkins();
      this.loadResult();
    },

    async loadSkins() {
      try {
        const r = await fetch('/api/skins');
        if (!r.ok) return;
        const data = await r.json();
        if (Array.isArray(data.skins) && data.skins.length) this.skins = data.skins;
      } catch (_) { /* 用内置默认 */ }
    },

    chooseSkin(id) {
      this.selectedSkin = id;
      try { localStorage.setItem('rz-skin', id); } catch (_) {}
      this.pushSkin();
    },

    /** 主动 postMessage 通知 iframe 换皮 */
    pushSkin() {
      const el = this.$refs.demoFrame;
      if (!el || !el.contentWindow) return;
      try {
        el.contentWindow.postMessage({ type: 'rz:setSkin', skin: this.selectedSkin }, '*');
      } catch (_) {}
    },

    currentSkinLabel() {
      const s = this.skins.find(x => x.id === this.selectedSkin);
      return s ? s.label : this.selectedSkin;
    },

    async loadResult() {
      try {
        const r = await fetch(`/api/result/${this.jobId}`);
        if (!r.ok) throw new Error('拉取结果失败');
        const data = await r.json();
        if (data.status !== 'DONE') {
          // 还没跑完 → 回到进度页
          location.href = `/progress.html?jobId=${encodeURIComponent(this.jobId)}`;
          return;
        }
        this.plan = data.plan;
        this.pitch = data.pitch;
        this.opinionsList = data.opinions || [];
        this.htmlFallback = !!data.htmlFallback;
      } catch (err) {
        alert(err.message);
      } finally {
        this.loading = false;
      }
    }
  };
}
</script>
</body>
</html>
