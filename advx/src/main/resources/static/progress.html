<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fafafa">
  <title>再活一次 · 协作复活中</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/shared.css?v=20260724-ui3">
</head>
<body x-data="progressPage()" x-init="init()" class="page-shell">
  <header class="site-header">
    <div class="site-header-inner">
      <a href="/" class="brand" aria-label="返回再活一次首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M12 3v18M7 8.5A5 5 0 0 1 12 4a5 5 0 0 1 5 4.5c0 3.7-5 5.1-5 8.5"/>
            <path d="m8.5 14.5 3.5 3 3.5-3"/>
          </svg>
        </span>
        <span>
          <span class="brand-name">再活一次</span>
          <span class="brand-subtitle">Collaborative Recovery</span>
        </span>
      </a>
      <div class="header-meta">
        <span class="ui-badge">
          <span class="status-dot" aria-hidden="true"></span>
          <span class="header-label">协作任务</span>
        </span>
        <span class="ui-badge console">JOB · <span x-text="jobId"></span></span>
      </div>
    </div>
  </header>

  <main class="progress-main">
    <section class="ui-card job-overview fade-in" aria-labelledby="progress-title">
      <div class="job-overview-top">
        <div>
          <h1 id="progress-title" class="job-title" x-text="progressTitle"></h1>
          <p class="job-subtitle" x-text="viewMode === 'map' ? '协作路径已收束，复活方案已经就绪。' : '负责人正在读取项目证据并形成各自判断。'"></p>
        </div>
        <div class="job-progress-value"><span x-text="progress"></span>%</div>
      </div>
      <div class="progress-track"
           role="progressbar"
           aria-label="项目分析进度"
           aria-valuemin="0"
           aria-valuemax="100"
           :aria-valuenow="progress">
        <div class="progress-fill" :style="`width:${progress}%`"></div>
      </div>
    </section>

    <div x-show="missingJob" x-cloak class="ui-alert" role="alert">
      <span>该任务已不在当前服务中，请重新上传项目。</span>
      <a href="/" class="ui-button ui-button-outline">返回上传页</a>
    </div>

    <section x-show="viewMode === 'workflow'" class="workflow-section fade-in" aria-labelledby="workflow-title">
      <div class="workflow-intro">
        <div>
          <div class="section-kicker">Live collaboration</div>
          <h2 id="workflow-title" class="section-title">负责人协作工作台</h2>
          <p class="muted-copy text-sm mt-2">每个节点都来自当前项目的可见分析过程，结论形成后会自动推进。</p>
        </div>
        <div class="workflow-source">
          <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M4 7h16M7 3h10l2 4H5l2-4ZM6 7v13h12V7"/>
          </svg>
          项目资料已分发
        </div>
      </div>

      <div class="workflow-list">
        <template x-for="(leader, index) in leaders" :key="leader.id">
          <div class="work-row">
            <div class="root-slot" aria-hidden="true">
              <div class="source-node"></div>
            </div>

            <article class="leader-card"
                     :class="leader.state === 'active' ? 'active' : (leader.state === 'done' ? 'done' : '')">
              <div class="leader-heading">
                <div>
                  <div class="leader-phase" x-text="leader.phase"></div>
                  <div class="leader-name" x-text="leader.name"></div>
                </div>
                <span class="leader-state" :class="statusClass(leader)" x-text="statusText(leader)"></span>
              </div>
              <div class="leader-role" x-text="leader.role"></div>
            </article>

            <div class="leader-details">
              <div class="lane-panel">
                <div class="lane-label">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M9.7 2.6a2 2 0 0 1 4.6 0l.2.7a2 2 0 0 0 1.4 1.4l.7.2a2 2 0 0 1 0 4.6l-.7.2a2 2 0 0 0-1.4 1.4l-.2.7a2 2 0 0 1-4.6 0l-.2-.7A2 2 0 0 0 8.1 9.7l-.7-.2a2 2 0 0 1 0-4.6l.7-.2a2 2 0 0 0 1.4-1.4l.2-.7Z"/><path d="M12 6v2M12 15v7M8 18h8"/></svg>
                  分析节点
                </div>
                <div class="thought-lane">
                  <template x-if="analysisNodes(leader).length === 0">
                    <div class="thought-card pending">等待项目资料与上游输入</div>
                  </template>
                  <template x-for="(thought, i) in analysisNodes(leader)" :key="i">
                    <div class="thought-card" x-text="thought.message"></div>
                  </template>
                </div>
              </div>

              <div class="lane-panel">
                <div class="lane-label">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/><path d="m17 17 2 2 4-4"/></svg>
                  工作过程
                </div>
                <div class="process-lane">
                  <template x-if="workSteps(leader).length === 0">
                    <div class="process-card pending">等待可见分析过程</div>
                  </template>
                  <template x-for="(process, i) in workSteps(leader)" :key="i">
                    <div class="process-card">
                      <strong x-text="process.title"></strong>
                      <span> · </span>
                      <span x-text="process.detail"></span>
                    </div>
                  </template>
                </div>
              </div>

              <div class="lane-panel">
                <div class="lane-label">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
                  岗位结论
                </div>
                <div class="conclusion-lane">
                  <template x-if="leader.state !== 'done'">
                    <div class="conclusion-card pending">等待形成岗位结论</div>
                  </template>
                  <template x-if="leader.state === 'done'">
                    <div class="conclusion-card" x-text="leader.summary || '已提交岗位结论'"></div>
                  </template>
                </div>
              </div>
            </div>
          </div>
        </template>
      </div>
    </section>

    <section x-show="viewMode === 'map'" x-cloak class="decision-wrap fade-in" aria-labelledby="decision-title">
      <div class="ui-card decision-hero">
        <div class="decision-icon" aria-hidden="true">
          <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M20 6 9 17l-5-5"/>
          </svg>
        </div>
        <span class="ui-badge ui-badge-primary">协作已完成</span>
        <h2 id="decision-title" class="section-title mt-4">复活方案已收束</h2>
        <p class="muted-copy text-sm mt-2">六位负责人完成判断，以下是本次决策形成的完整路径。</p>
      </div>

      <div class="decision-timeline">
        <template x-for="(leader,i) in orderedLeaders()" :key="leader.id">
          <div class="decision-item">
            <div class="decision-item-index console" x-text="String(i + 1).padStart(2, '0')"></div>
            <article class="mind-node" :class="leader.id === 'product-owner' ? 'final' : ''">
              <div class="leader-heading">
                <div>
                  <div class="leader-phase" x-text="leader.phase"></div>
                  <div class="leader-name" x-text="leader.name"></div>
                </div>
                <span class="ui-badge console" x-text="formatTime(leader.completedAt)"></span>
              </div>
              <p class="muted-copy text-sm mt-3" x-text="leader.summary || '已完成岗位结论'"></p>
            </article>
            <div x-show="i < orderedLeaders().length - 1" class="mind-line"></div>
          </div>
        </template>
      </div>

      <div class="decision-action">
        <button x-show="pipelineDone" @click="goResult()" class="ui-button ui-button-primary">
          查看复活 Demo
          <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <div x-show="!pipelineDone" class="muted-copy text-xs">正在等待交付产物生成…</div>
      </div>
    </section>

    <div class="mt-6 text-center">
      <a href="/" class="ui-button ui-button-ghost">
        <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        取消并返回首页
      </a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <span>再活一次 · Collaborative Recovery Workspace</span>
      <span class="console">LIVE · <span x-text="progress"></span>%</span>
    </div>
  </footer>
<script>
function progressPage() { return {
  jobId:null, progress:0, progressTitle:'正在建立协作流程…', viewMode:'workflow', pipelineDone:false, missingJob:false, _es:null, seenEvents:new Set(),
  leaders:[
    {id:'pm',name:'产品经理',role:'还原用户问题与 MVP 方向',phase:'第一阶段 · 产品诊断',state:'waiting',thoughts:[],processes:[],completedAt:null,summary:''},
    {id:'tech',name:'技术负责人',role:'评估资产、技术债与实现边界',phase:'第一阶段 · 技术诊断',state:'waiting',thoughts:[],processes:[],completedAt:null,summary:''},
    {id:'ux',name:'UX 设计师',role:'定义核心流程与体验瞬间',phase:'第二阶段 · 体验方案',state:'waiting',thoughts:[],processes:[],completedAt:null,summary:''},
    {id:'growth',name:'增长负责人',role:'判断定位与首个增长切口',phase:'第二阶段 · 增长策略',state:'waiting',thoughts:[],processes:[],completedAt:null,summary:''},
    {id:'delivery',name:'交付负责人',role:'收敛范围、风险与 MVP',phase:'第三阶段 · 交付收敛',state:'waiting',thoughts:[],processes:[],completedAt:null,summary:''},
    {id:'product-owner',name:'产品负责人',role:'选择唯一复活方向并完成决策',phase:'最终阶段 · 产品决策',state:'waiting',thoughts:[],processes:[],completedAt:null,summary:''}
  ],
  legacyNames:{'考古学家':'产品经理','验尸官':'技术负责人','拾荒者':'UX 设计师','改造家':'增长负责人','仲裁者':'产品负责人'},
  init(){ this.jobId=new URLSearchParams(location.search).get('jobId'); if(!this.jobId){location.href='/';return;} this.subscribe(); },
  subscribe(){ const es=new EventSource(`/api/analyze/${this.jobId}`); this._es=es; es.addEventListener('progress',evt=>this.consume(JSON.parse(evt.data))); es.onerror=()=>setTimeout(()=>this.pollOnce(),800); },
  leaderFor(stage){ return this.leaders.find(x=>x.name===(this.legacyNames[stage]||stage)); },
  analysisNodes(leader){return leader.thoughts.filter(thought=>thought.kind !== 'final');},
  workSteps(leader){return leader.processes.filter(process=>process.title !== '形成岗位结论' && process.title !== '形成最终决策');},
  recordProcess(leader,event){const payload=event.payload;if(!payload){leader.processes.push({title:'开始分析',detail:event.message||'正在处理项目资料'});return;}const evidenceCount=Array.isArray(payload.evidence)?payload.evidence.length:0;const candidateCount=Array.isArray(payload.candidates)?payload.candidates.length:0;if(evidenceCount)leader.processes.push({title:'核对项目证据',detail:`已提取 ${evidenceCount} 条项目内证据`});if(candidateCount)leader.processes.push({title:'比较复活方向',detail:`已评估 ${candidateCount} 个候选方向`});if(!leader.processes.some(item=>item.title==='形成岗位结论'))leader.processes.push({title:'形成岗位结论',detail:payload.summary||payload.heartWhy||event.message||'已提交结论'});},
  recordOpinionProcess(leader,opinion){if(!leader.processes.some(item=>item.title==='形成岗位结论'))this.recordProcess(leader,{payload:opinion,message:opinion.summary});},
  consume(e){ const key=[e.timestamp,e.stage,e.message,e.status].join('|'); if(this.seenEvents.has(key))return; this.seenEvents.add(key); if(typeof e.progress==='number')this.progress=e.progress; this.progressTitle=e.message||this.progressTitle; const leader=this.leaderFor(e.stage); if(leader){this.recordProcess(leader,e);const final=Boolean(e.payload)||(e.message||'').includes('已提交')||(e.message||'').includes('已选定'); leader.thoughts.push({message:e.message||'正在处理项目资料',kind:final?'final':'step'}); if(final){leader.state='done';leader.completedAt=e.timestamp;leader.summary=e.payload?.summary||e.payload?.heartWhy||e.message;}else leader.state='active';} if(e.status==='DONE')this.handleDone(); if(e.status==='FAILED'){this.close();alert('复活失败：'+(e.message||'未知错误'));} },
  async handleDone(){ if(this.pipelineDone)return; this.pipelineDone=true; await this.hydrateResult(); this.enterMindmap(); },
  async hydrateResult(){ try{const r=await fetch(`/api/result/${this.jobId}`);if(!r.ok)return;const data=await r.json();(data.opinions||[]).forEach((op,i)=>{const leader=this.leaderFor(op.agentName);if(!leader)return;leader.state='done';leader.completedAt||=(new Date(Date.now()+i)).toISOString();leader.summary=op.summary||leader.summary;this.recordOpinionProcess(leader,op);if(!leader.thoughts.some(t=>t.kind==='final'))leader.thoughts.push({message:op.summary||'已提交岗位结论',kind:'final'});});if(data.plan){const owner=this.leaderFor('产品负责人');owner.state='done';owner.completedAt||=(new Date(Date.now()+10)).toISOString();owner.summary=data.plan.heartWhy||data.plan.newProductName||'已完成最终决策';if(!owner.processes.some(item=>item.title==='形成岗位结论'))owner.processes.push({title:'形成最终决策',detail:owner.summary});if(!owner.thoughts.some(t=>t.kind==='final'))owner.thoughts.push({message:owner.summary,kind:'final'});}}catch(_){} },
  async pollOnce(){try{const r=await fetch(`/api/result/${this.jobId}`);if(r.status===404){this.missingJob=true;this.progressTitle='任务已失效，请重新上传';this.close();return;}if(r.ok&&(await r.json()).status==='DONE')this.handleDone();}catch(_){}},
  orderedLeaders(){return this.leaders.filter(x=>x.completedAt).sort((a,b)=>new Date(a.completedAt)-new Date(b.completedAt));},
  statusText(x){return x.state==='done'?'已完成':x.state==='active'?'分析中':'等待输入';}, statusClass(x){return x.state==='done'?'text-green-700':x.state==='active'?'text-[var(--accent)]':'text-stone-400';},
  enterMindmap(){if(this.viewMode==='map')return;this.viewMode='map';},
  goResult(){this.close();location.href=`/result.html?jobId=${encodeURIComponent(this.jobId)}`;}, close(){if(this._es){this._es.close();this._es=null;}},
  formatTime(v){try{return new Date(v).toLocaleTimeString('zh-CN',{hour12:false});}catch(_){return '';}}
};}
</script>
</body>
</html>
