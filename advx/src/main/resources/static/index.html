<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>再活一次 · 上传你放弃的项目</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/shared.css">
</head>
<body x-data="uploadPage()" class="min-h-screen">

  <!-- Header -->
  <header class="border-b border-stone-300">
    <div class="max-w-6xl mx-auto px-8 py-6 flex items-center justify-between">
      <div>
        <div class="text-xs tracking-[0.3em] text-[var(--accent)] uppercase">Resurrect · E「反转」</div>
        <h1 class="text-2xl md:text-3xl font-black mt-1">再活一次<span class="text-[var(--accent)]">.</span></h1>
        <div class="text-xs text-stone-500 mt-1">从被放弃的项目里，找出仍然活着的部分</div>
      </div>
      <div class="text-xs text-stone-500 hidden md:block console">
        <span class="flame">🔥</span> multi-agent
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-8 py-10">

    <section class="fade-in">
      <div class="text-center max-w-2xl mx-auto mb-8">
        <p class="text-lg text-stone-700 leading-relaxed">
          把一个你放弃了的项目压缩包扔进来，<br>
          我们派四位智能体去里面翻找 —— <br>
          <span class="text-[var(--accent)] font-bold">看看有没有什么，还在跳。</span>
        </p>
      </div>

      <label class="drop-zone block rounded-lg p-12 cursor-pointer text-center"
             :class="drag ? 'drag' : ''"
             @dragover.prevent="drag=true"
             @dragleave.prevent="drag=false"
             @drop.prevent="onDrop($event)">
        <input type="file" class="hidden" accept=".zip,.tar,.tar.gz,.tgz,.7z,.rar" @change="onPick($event)">
        <div class="text-5xl mb-3">🪦</div>
        <div class="text-lg font-bold">把 .zip / .tar.gz / .7z / .rar 拖进来</div>
        <div class="text-sm text-stone-500 mt-1">或点这里选择文件（≤ 20MB）</div>
      </label>

      <div x-show="uploading" class="mt-6 text-center text-sm text-stone-500">
        <span class="flame">🔥</span> 正在上传，稍等……
      </div>

      <div class="mt-8 text-xs text-stone-500 grid grid-cols-1 md:grid-cols-4 gap-4">
        <div><b class="text-stone-800">1. 解压 &amp; 阅读</b><br>安全地扫描项目文件，找出关键代码与线索</div>
        <div><b class="text-stone-800">2. 四位 Agent</b><br>考古学家 · 验尸官 · 拾荒者 · 改造家</div>
        <div><b class="text-stone-800">3. 仲裁</b><br>选出唯一一个"最有戏"的复活点</div>
        <div><b class="text-stone-800">4. 复活体</b><br>生成可运行的单页 demo + 复活企划书</div>
      </div>
    </section>
  </main>

  <footer class="border-t border-stone-300 mt-10">
    <div class="max-w-6xl mx-auto px-8 py-6 text-xs text-stone-500 flex flex-col md:flex-row md:justify-between gap-2">
      <div>再活一次 · Digital Project Resurrection System · AdventureX 2026</div>
      <div class="console"></div>
    </div>
  </footer>

<script>
function uploadPage() {
  return {
    drag: false,
    uploading: false,

    onDrop(e) {
      this.drag = false;
      const f = e.dataTransfer.files?.[0];
      if (f) this.upload(f);
    },
    onPick(e) {
      const f = e.target.files?.[0];
      if (f) this.upload(f);
    },

    async upload(file) {
      const fd = new FormData();
      fd.append('file', file);
      this.uploading = true;
      try {
        const resp = await fetch('/api/upload', { method: 'POST', body: fd });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || '上传失败');
        window.location.href = `/progress.html?jobId=${encodeURIComponent(data.jobId)}`;
      } catch (err) {
        alert(err.message);
        this.uploading = false;
      }
    }
  };
}
</script>
</body>
</html>
